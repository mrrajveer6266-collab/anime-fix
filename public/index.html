<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Fix - Ultimate Streaming</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161b26;
            --accent-color: #ff4757;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; }
        
        header {
            background: rgba(11, 15, 25, 0.95);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #1f293d;
        }
        .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); }
        .search-box input {
            background: var(--card-bg);
            border: 1px solid #2d3748;
            padding: 8px 15px;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
            width: 150px;
        }

        .container { padding: 15px; max-width: 900px; margin: 0 auto; }
        
        /* Video Player */
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #1f293d;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-wrapper iframe { width: 100%; height: 100%; border: none; }

        /* Episode Grid */
        .section-title { font-size: 16px; margin: 15px 0 10px 0; border-left: 4px solid var(--accent-color); padding-left: 8px; font-weight: bold; }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .ep-btn {
            background: var(--card-bg);
            border: 1px solid #2d3748;
            color: #fff;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }
        .ep-btn:hover, .ep-btn.active { background: var(--accent-color); border-color: var(--accent-color); }

        /* Bottom Nav */
        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #111827; border-top: 1px solid #1f293d;
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000;
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 10px; text-transform: uppercase; font-weight: bold; }
        .nav-item.active { color: var(--accent-color); }
        .nav-item div { font-size: 16px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🔥 ANIME FIX</div>
        <div class="search-box">
            <input type="text" id="search" placeholder="एनीमे खोजें...">
        </div>
    </header>

    <div class="container">
        <div class="player-wrapper" id="playerContainer">
            <p style="color: #777; font-size: 13px;">नीचे से एपिसोड चुनें और स्ट्रीमिंग शुरू करें!</p>
        </div>

        <div class="section-title">सभी एपिसोड्स</div>
        <div class="episode-grid" id="epGrid"></div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><div>🏠</div>होम</a>
        <a href="#" class="nav-item"><div>🔥</div>ट्रेंडिंग</a>
        <a href="#" class="nav-item"><div>🔖</div>वॉचलिस्ट</a>
        <a href="#" class="nav-item"><div>⚙️</div>सेटिंग्स</a>
    </nav>

    <script>
        // उदाहरण के लिए 24 एपिसोड्स लोड किए जा रहे हैं (इसे आप अपने डेटा से बदल सकते हैं)
        const totalEps = 24;
        const grid = document.getElementById('epGrid');
        const container = document.getElementById('playerContainer');

        for (let i = 1; i <= totalEps; i++) {
            let btn = document.createElement('div');
            btn.className = `ep-btn ${i === 1 ? 'active' : ''}`;
            btn.innerText = `Ep ${i}`;
            btn.id = `ep-${i}`;

            btn.onclick = function() {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                container.innerHTML = `<iframe src="https://vidsrc.xyz/embed/anime/my-clueless-first-friend/${i}" allowfullscreen></iframe>`;
            };
            grid.appendChild(btn);
        }
    </script>
</body>
</html>
