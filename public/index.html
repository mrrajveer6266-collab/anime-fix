<script>
(function(){

  let filterData = null;

  function animeObj(item){
    return item && item.node ? item.node : item;
  }

  function genresOf(a){
    return (a.genres || []).map(g =>
      typeof g === 'string' ? g : (g.name || '')
    );
  }

  async function getFilterData(){
    if(filterData) return filterData;

    const all = [];

    for(let page=1; page<=5; page++){
      try{
        const r = await fetch('/api/all-anime?page=' + page + '&_=' + Date.now());
        if(!r.ok) continue;

        const j = await r.json();

        if(Array.isArray(j.data)){
          all.push(...j.data.map(animeObj));
        }
      }catch(e){
        console.error('Filter data error:',e);
      }
    }

    filterData = all;
    return all;
  }

  async function autoFilter(){

    const genre = document.getElementById('genreFilter')?.value || '';
    const type = document.getElementById('typeFilter')?.value || '';
    const status = document.getElementById('statusFilter')?.value || '';
    const year = document.getElementById('yearFilter')?.value || '';
    const sort = document.getElementById('sortFilter')?.value || '';
    const score = document.getElementById('scoreFilter')?.value || '';

    const statusBox = document.getElementById('filterStatus');

    if(!genre && !type && !status && !year && !sort && !score){
      if(window.loadAnime){
        window.loadAnime(1);
      }
      if(statusBox) statusBox.textContent='';
      return;
    }

    if(statusBox) statusBox.textContent='⏳ Filtering anime...';

    const list = await getFilterData();

    let result = list.filter(a => {

      if(genre && !genresOf(a).some(g =>
        g.toLowerCase() === genre.toLowerCase()
      )) return false;

      if(type && String(a.media_type || '').toLowerCase() !== type)
        return false;

      if(score && Number(a.mean || 0) < Number(score))
        return false;

      if(year){
        const y = a.start_date ? String(a.start_date).slice(0,4) : '';
        if(y !== year) return false;
      }

      if(status){
        const airing = !a.end_date && Number(a.num_episodes || 0) !==
          Number(a.my_list_status?.num_episodes_watched || 0);

        if(status === 'airing' && !airing) return false;
        if(status === 'finished' && airing) return false;
      }

      return true;
    });

    if(sort === 'score'){
      result.sort((a,b)=>
        Number(b.mean||0)-Number(a.mean||0)
      );
    }

    if(sort === 'popularity'){
      result.sort((a,b)=>
        Number(a.popularity||999999)-Number(b.popularity||999999)
      );
    }

    if(sort === 'title'){
      result.sort((a,b)=>
        String(a.title||'').localeCompare(String(b.title||''))
      );
    }

    if(sort === 'newest'){
      result.sort((a,b)=>
        String(b.start_date||'').localeCompare(String(a.start_date||''))
      );
    }

    if(window.renderAnime){
      window.renderAnime(result,false);
    }

    if(statusBox){
      statusBox.textContent =
        '✨ ' + result.length + ' anime found';
    }
  }

  function resetFilters(){
    ['genreFilter','typeFilter','statusFilter','yearFilter',
     'sortFilter','scoreFilter'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.value='';
    });

    filterData=null;

    if(window.loadAnime){
      window.loadAnime(1);
    }

    const statusBox=document.getElementById('filterStatus');
    if(statusBox) statusBox.textContent='';
  }

  document.addEventListener('change',function(e){
    if(e.target.matches(
      '#genreFilter,#typeFilter,#statusFilter,#yearFilter,#sortFilter,#scoreFilter'
    )){
      autoFilter();
    }
  });

  document.addEventListener('click',function(e){
    if(e.target.closest('#resetFiltersButton')){
      resetFilters();
    }
  });

  window.autoFilterAnime=autoFilter;
  window.resetAnimeFilters=resetFilters;

})();
</script>

<body>

<h1>Anime Fix</h1>

<div class="search-box">
  <input id="searchInput" type="text" placeholder="Search anime...">
  <button onclick="searchAnime()">Search</button>
</div>





<div id="status">Loading anime...</div>
<div id="animeContainer" class="grid"></div>

<div class="more">
  <button onclick="loadMore()">⚡ Load More Anime</button>
</div>

<div id="animeModal" class="modal">
  <div class="modal-box">
    <span class="close" onclick="closeModal()">×</span>
    <div id="modalDetails">Loading...</div>
  </div>
</div>

<script>
let currentPage = 1;
let loading = false;
let searchMode = false;

async function fetchAnime(url, append=false) {
  if (loading) return;
  loading = true;

  const status = document.getElementById('status');
  status.innerText = '⏳ Loading anime...';

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('API error');

    const data = await res.json();
    const list = data.data || [];

    renderAnime(list, append);

    status.innerText = list.length
      ? `Showing ${list.length} anime`
      : 'No anime found.';
  } catch (e) {
    console.error(e);
    status.innerText = '❌ Error loading anime.';
  } finally {
    loading = false;
  }
}

function loadAnime(page=1) {
  searchMode = false;
  currentPage = page;
  fetchAnime(`/api/all-anime?page=${page}`, page > 1);
}

function loadMore() {
  if (!searchMode) {
    currentPage++;
    fetchAnime(`/api/all-anime?page=${currentPage}`, true);
  }
}

async function searchAnime() {
  const q = document.getElementById('searchInput').value.trim();

  if (!q) {
    currentPage = 1;
    loadAnime(1);
    return;
  }

  searchMode = true;
  loading = true;
  document.getElementById('status').innerText = '🔎 Searching...';

  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    if (!res.ok) throw new Error('Search error');

    const data = await res.json();
    renderAnime(data.data || [], false);

    document.getElementById('status').innerText =
      `${(data.data || []).length} results found`;
  } catch (e) {
    console.error(e);
    document.getElementById('status').innerText = '❌ Search failed.';
  } finally {
    loading = false;
  }
}

function renderAnime(list, append=false) {
  const container = document.getElementById('animeContainer');

  if (!append) container.innerHTML = '';

  if (!list.length && !append) {
    container.innerHTML = '<p>No anime found.</p>';
    return;
  }

  list.forEach(item => {
    const anime = item.node || item;

    const id = anime.id;
    const title = anime.title || 'Unknown Anime';
    const image =
      anime.main_picture?.large ||
      anime.main_picture?.medium ||
      '';

    const score = anime.mean ?? 'N/A';
    const episodes = anime.num_episodes || 'N/A';

    const card = document.createElement('div');
    card.className = 'card';

    card.onclick = () => showAnime(id);

    card.innerHTML = `
      <img src="${image}" alt="${escapeHtml(title)}" loading="lazy">
      <h3>${escapeHtml(title)}</h3>
      <p>⭐ ${score} &nbsp; • &nbsp; 📺 ${episodes}</p>
    `;

    container.appendChild(card);
  });
}

async function showAnime(id) {
  const modal = document.getElementById('animeModal');
  const details = document.getElementById('modalDetails');

  modal.style.display = 'block';
  details.innerHTML = '⏳ Loading details...';

  try {
    const res = await fetch(`/api/anime/${id}`);
    if (!res.ok) throw new Error('Details error');

    const anime = await res.json();

    const image =
      anime.main_picture?.large ||
      anime.main_picture?.medium ||
      '';

    const genres = (anime.genres || [])
      .map(g => g.name)
      .join(', ') || 'N/A';

    const studios = (anime.studios || [])
      .map(s => s.name)
      .join(', ') || 'N/A';

    details.innerHTML = `
      <img class="details-img" src="${image}" alt="${escapeHtml(anime.title || '')}">
      <h2>${escapeHtml(anime.title || 'Unknown Anime')}</h2>

      <div class="meta">
        ⭐ Rating: ${anime.mean ?? 'N/A'}<br>
        📺 Episodes: ${anime.num_episodes || 'N/A'}<br>
        🎭 Genres: ${escapeHtml(genres)}<br>
        🎬 Studio: ${escapeHtml(studios)}<br>
        📅 Start: ${anime.start_date || 'N/A'}<br>
        📅 End: ${anime.end_date || 'Ongoing'}
      </div>

      <p>${escapeHtml(anime.synopsis || 'No description available.')}</p>
    `;
  } catch (e) {
    console.error(e);
    details.innerHTML = '❌ Error loading details.';
  }
}

function closeModal() {
  document.getElementById('animeModal').style.display = 'none';
}

window.onclick = function(e) {
  const modal = document.getElementById('animeModal');
  if (e.target === modal) closeModal();
};

function escapeHtml(text) {
  return String(text)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

async function applyFilters() {
  const genre = document.getElementById('genreFilter').value;
  const type = document.getElementById('typeFilter').value;
  const sort = document.getElementById('sortFilter').value;

  const status = document.getElementById('status');
  status.innerText = '⏳ Applying filters...';

  try {
    const res = await fetch('/api/all-anime?page=1');
    if (!res.ok) throw new Error('Filter API error');

    const data = await res.json();

    let list = (data.data || []).filter(item => {
      const anime = item.node || item;

      const genreMatch =
        !genre ||
        (anime.genres || []).some(g => g.name === genre);

      const typeMatch =
        !type ||
        anime.media_type === type;

      return genreMatch && typeMatch;
    });

    if (sort === 'score') {
      list.sort((a, b) =>
        (b.node || b).mean - (a.node || a).mean
      );
    }

    if (sort === 'title') {
      list.sort((a, b) =>
        (a.node || a).title.localeCompare((b.node || b).title)
      );
    }

    renderAnime(list, false);

    status.innerText = `${list.length} anime found`;
  } catch (error) {
    console.error(error);
    status.innerText = '❌ Filter failed.';
  }
}

loadAnime(1);
</script>

  }

    if(filterAnimeData.length > 0){
      return filterAnimeData;
    }

    const all = [];

    for(let page = 1; page <= 5; page++){

      const response = await fetch(
        '/api/all-anime?page=' + page,
        { cache: 'no-store' }
      );

      if(!response.ok){
        throw new Error('Anime API error: ' + response.status);
      }

      const json = await response.json();
      const rows = json.data || [];

      rows.forEach(function(row){
        const anime = animeObject(row);
        if(anime && anime.id){
          all.push(anime);
        }
      });

      if(rows.length < 25){
        break;
      }
    }

    filterAnimeData = all;
    return all;
  }

  function renderResults(list){

    if(typeof window.renderAnime === 'function'){
      window.renderAnime(list, false);
      return;
    }

    const container =
      document.getElementById('animeContainer');

    if(!container){
      throw new Error('animeContainer not found');
    }

    container.innerHTML = '';

    list.forEach(function(anime){

      const image =
        anime.main_picture &&
        anime.main_picture.large
          ? anime.main_picture.large
          : anime.main_picture &&
            anime.main_picture.medium
              ? anime.main_picture.medium
              : '';

      const card = document.createElement('div');

      card.className = 'anime-card';

      card.innerHTML =
        '<img src="' + image + '" alt="' +
        String(anime.title || '').replace(/"/g,'&quot;') +
        '">' +
        '<h3>' +
        String(anime.title || '') +
        '</h3>';

      container.appendChild(card);
    });
  }

  async function applyAnimeFilters(){

    const status =
      document.getElementById('status');

    const genre =
      document.getElementById('genreFilter').value.toLowerCase();

    const type =
      document.getElementById('typeFilter').value;

    const selectedStatus =
      document.getElementById('statusFilter').value;

      document.getElementById('yearFilter').value;

      document.getElementById('sortFilter').value;

    const minScore =
      document.getElementById('scoreFilter').value;

      status.innerText = '⏳ Applying filters...';

    try{

      const data = await loadFilterData();

      let results = data.filter(function(anime){

        const genres = getGenreNames(anime);

        const genreOK =
          !genre || genres.includes(genre);

        const typeOK =
          !type || anime.media_type === type;

        const score =
          Number(anime.mean || 0);

        const scoreOK =
          !minScore ||
          score >= Number(minScore);

        const yearOK =
          !year ||
          String(anime.start_date || '')
            .startsWith(year);

        let statusOK = true;

        if(selectedStatus === 'finished'){
          statusOK =
            anime.end_date !== null &&
            anime.end_date !== undefined &&
            anime.end_date !== '';
        }

        if(selectedStatus === 'airing'){
          statusOK =
            !anime.end_date ||
            anime.end_date === null;
        }

        return (
          genreOK &&
          typeOK &&
          scoreOK &&
          yearOK &&
          statusOK
        );
      });

      if(sort === 'score'){
        results.sort(function(a,b){
          return Number(b.mean || 0) -
                 Number(a.mean || 0);
        });
      }

      if(sort === 'popularity'){
        results.sort(function(a,b){
          return Number(a.popularity || 999999) -
                 Number(b.popularity || 999999);
        });
      }

      if(sort === 'title'){
        results.sort(function(a,b){
          return String(a.title || '')
            .localeCompare(String(b.title || ''));
        });
      }

      if(sort === 'newest'){
        results.sort(function(a,b){
          return String(b.start_date || '')
            .localeCompare(String(a.start_date || ''));
        });
      }

      renderResults(results);

      if(status){
        status.innerText =
          '✅ ' + results.length + ' anime found';
      }

    }catch(error){

      console.error('Anime Fix filter error:', error);

      if(status){
        status.innerText =
          '❌ Filter error: ' + error.message;
      }
    }
  }

  function resetAnimeFilters(){

    [
      'genreFilter',
      'typeFilter',
      'statusFilter',
      'yearFilter',
      'sortFilter',
      'scoreFilter'
    ].forEach(function(id){

      const element =
        document.getElementById(id);

      if(element){
        element.value = '';
      }

    });

    filterAnimeData = [];

    if(typeof window.loadAnime === 'function'){
      window.loadAnime(1);
    }else{
      location.reload();
    }
  }

  document.addEventListener('click', function(event){

    if(event.target.closest('#applyFiltersButton')){
      event.preventDefault();
      applyAnimeFilters();
    }

    if(event.target.closest('#resetFiltersButton')){
      event.preventDefault();
      resetAnimeFilters();
    }

  });

  window.applyAnimeFilters = applyAnimeFilters;
  window.resetAnimeFilters = resetAnimeFilters;

})();
</script>
