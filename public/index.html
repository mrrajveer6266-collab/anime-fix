<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Fix — Watch & Discover Anime</title>
  <meta name="description" content="Anime Fix - Discover anime, ratings, genres, episodes and official trailers.">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#08090d;
      color:#fff;
      min-height:100vh;
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at 15% 10%,rgba(124,58,237,.20),transparent 30%),
        radial-gradient(circle at 85% 20%,rgba(236,72,153,.15),transparent 28%);
      pointer-events:none;
      z-index:-1;
    }
    header{
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(18px);
      background:rgba(8,9,13,.82);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .nav{
      max-width:1200px;
      margin:auto;
      padding:16px 18px;
      display:flex;
      align-items:center;
      gap:20px;
    }
    .logo{
      font-size:25px;
      font-weight:900;
      letter-spacing:-1px;
      white-space:nowrap;
    }
    .logo span{
      color:#a855f7;
    }
    .search{
      flex:1;
      display:flex;
      max-width:620px;
      margin-left:auto;
    }
    .search input{
      width:100%;
      padding:13px 16px;
      border:1px solid rgba(255,255,255,.12);
      border-right:0;
      outline:none;
      color:white;
      background:#12141b;
      border-radius:12px 0 0 12px;
      font-size:15px;
    }
    .search button,.load{
      border:0;
      cursor:pointer;
      color:#fff;
      font-weight:700;
      background:linear-gradient(135deg,#7c3aed,#db2777);
    }
    .search button{
      padding:0 20px;
      border-radius:0 12px 12px 0;
    }
    main{
      max-width:1200px;
      margin:auto;
      padding:30px 18px 60px;
    }
    .hero{
      min-height:260px;
      padding:35px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      display:flex;
      align-items:center;
      margin-bottom:28px;
      overflow:hidden;
      position:relative;
      background:linear-gradient(120deg,rgba(124,58,237,.22),rgba(219,39,119,.10));
    }
    .hero h1{
      font-size:clamp(32px,6vw,62px);
      line-height:1;
      margin-bottom:14px;
    }
    .hero h1 span{
      color:#c084fc;
    }
    .hero p{
      max-width:650px;
      color:#b7bac5;
      line-height:1.6;
    }
    .badge{
      display:inline-block;
      margin-bottom:15px;
      padding:7px 11px;
      border-radius:999px;
      background:rgba(168,85,247,.16);
      color:#d8b4fe;
      font-size:12px;
      font-weight:800;
      border:1px solid rgba(168,85,247,.25);
    }
    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:24px 0 16px;
    }
    .section-title h2{font-size:23px}
    .count{color:#858895;font-size:13px}
    .grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:16px;
    }
    .card{
      background:#11131a;
      border:1px solid rgba(255,255,255,.07);
      border-radius:16px;
      overflow:hidden;
      cursor:pointer;
      transition:.2s ease;
    }
    .card:hover{
      transform:translateY(-5px);
      border-color:rgba(168,85,247,.55);
      box-shadow:0 14px 35px rgba(0,0,0,.35);
    }
    .poster{
      width:100%;
      aspect-ratio:2/3;
      object-fit:cover;
      display:block;
      background:#1b1d25;
    }
    .info{padding:12px}
    .title{
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .meta{
      margin-top:8px;
      color:#9296a3;
      font-size:12px;
      display:flex;
      justify-content:space-between;
      gap:8px;
    }
    .rating{color:#facc15}
    .load-wrap{text-align:center;margin-top:28px}
    .load{
      padding:13px 26px;
      border-radius:12px;
      font-size:14px;
    }
    .load:disabled{opacity:.5;cursor:not-allowed}
    .status{
      text-align:center;
      color:#999daa;
      padding:30px 10px;
    }
    .modal{
      display:none;
      position:fixed;
      inset:0;
      z-index:50;
      background:rgba(0,0,0,.78);
      backdrop-filter:blur(8px);
      padding:20px;
      overflow:auto;
    }
    .modal.show{display:flex;align-items:center;justify-content:center}
    .modal-box{
      width:min(850px,100%);
      max-height:90vh;
      overflow:auto;
      background:#11131a;
      border:1px solid rgba(255,255,255,.1);
      border-radius:22px;
      padding:24px;
      position:relative;
    }
    .close{
      position:absolute;
      right:15px;
      top:12px;
      border:0;
      background:#242631;
      color:#fff;
      width:38px;
      height:38px;
      border-radius:50%;
      cursor:pointer;
      font-size:20px;
    }
    .details{
      display:grid;
      grid-template-columns:190px 1fr;
      gap:22px;
    }
    .details img{
      width:190px;
      border-radius:14px;
    }
    .details h2{font-size:28px;margin-bottom:10px}
    .details p{
      color:#b7bac5;
      line-height:1.65;
      margin-top:12px;
    }
    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:12px;
    }
    .chip{
      padding:6px 9px;
      background:#20222c;
      border-radius:999px;
      color:#c9cbd4;
      font-size:11px;
    }
    .trailer{
      display:inline-block;
      margin-top:18px;
      padding:11px 16px;
      border-radius:10px;
      background:#dc2626;
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }
    @media(max-width:950px){
      .grid{grid-template-columns:repeat(4,1fr)}
    }
    @media(max-width:700px){
      .nav{flex-wrap:wrap}
      .logo{width:100%}
      .search{width:100%;max-width:none}
      .hero{padding:25px;min-height:220px}
      .grid{grid-template-columns:repeat(2,1fr);gap:12px}
      .details{grid-template-columns:100px 1fr;gap:14px}
      .details img{width:100px}
      .details h2{font-size:20px}
    }
  </style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">ANIME <span>FIX</span></div>
    <form class="search" id="searchForm">
      <input id="searchInput" placeholder="Search anime..." autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </div>
</header>

<main>
  <section class="hero">
    <div>
      <div class="badge">DISCOVER • EXPLORE • ENJOY</div>
      <h1>Your Anime<br><span>Universe.</span></h1>
      <p>Discover anime, ratings, genres, episodes and official promotional videos — all in one clean place.</p>
    </div>
  </section>

  <div class="section-title">
    <h2 id="sectionTitle">🔥 Popular Anime</h2>
    <span class="count" id="count"></span>
  </div>

  <section class="grid" id="grid"></section>
  <div class="status" id="status">Loading anime...</div>

  <div class="load-wrap">
    <button class="load" id="loadBtn" hidden>Load More</button>
  </div>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" id="closeBtn">×</button>
    <div id="details"></div>
  </div>
</div>

<script>
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const loadBtn = document.getElementById('loadBtn');
  const count = document.getElementById('count');
  const sectionTitle = document.getElementById('sectionTitle');
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('searchInput');
  const modal = document.getElementById('modal');
  const details = document.getElementById('details');
  const closeBtn = document.getElementById('closeBtn');

  let page = 1;
  let query = '';
  let loading = false;
  let totalShown = 0;

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[c]));
  }

  function card(anime) {
    const title = anime.title || 'Unknown Anime';
    const image = anime.images?.webp?.large_image_url ||
                  anime.images?.jpg?.large_image_url ||
                  anime.images?.webp?.image_url || '';
    const score = anime.score ? '★ ' + anime.score : '—';
    const year = anime.year || anime.aired?.prop?.from?.year || '—';

    const el = document.createElement('article');
    el.className = 'card';
    el.innerHTML = `
      <img class="poster" src="${escapeHtml(image)}" alt="${escapeHtml(title)}" loading="lazy">
      <div class="info">
        <div class="title">${escapeHtml(title)}</div>
        <div class="meta">
          <span>${escapeHtml(year)}</span>
          <span class="rating">${escapeHtml(score)}</span>
        </div>
      </div>
    `;
    el.onclick = () => openDetails(anime.mal_id);
    return el;
  }

  async function loadAnime(reset = false) {
    if (loading) return;
    loading = true;
    loadBtn.disabled = true;
    status.textContent = 'Loading anime...';

    try {
      const endpoint = query
        ? `/api/search?q=${encodeURIComponent(query)}&page=${page}`
        : `/api/anime?page=${page}`;

      const response = await fetch(endpoint);
      if (!response.ok) throw new Error('Request failed');

      const data = await response.json();

      if (reset) {
        grid.innerHTML = '';
        totalShown = 0;
      }

      (data.anime || []).forEach(anime => {
        grid.appendChild(card(anime));
        totalShown++;
      });

      count.textContent = totalShown + ' shown';
      status.textContent = data.anime?.length
        ? ''
        : 'No anime found.';

      loadBtn.hidden = !data.hasNextPage;
      loadBtn.disabled = false;
    } catch (error) {
      console.error(error);
      status.textContent = 'Could not load anime. Please try again.';
      loadBtn.disabled = false;
    }

    loading = false;
  }

  async function openDetails(id) {
    modal.classList.add('show');
    details.innerHTML = '<div class="status">Loading details...</div>';

    try {
      const response = await fetch('/api/anime/' + id);
      if (!response.ok) throw new Error('Details failed');

      const a = await response.json();

      const image = a.images?.webp?.large_image_url ||
                    a.images?.jpg?.large_image_url || '';

      const genres = (a.genres || [])
        .map(g => `<span class="chip">${escapeHtml(g.name)}</span>`)
        .join('');

      const trailer = a.trailer?.url
        ? `<a class="trailer" href="${escapeHtml(a.trailer.url)}" target="_blank" rel="noopener">▶ Official Trailer</a>`
        : '';

      details.innerHTML = `
        <div class="details">
          <img src="${escapeHtml(image)}" alt="${escapeHtml(a.title)}">
          <div>
            <h2>${escapeHtml(a.title)}</h2>
            <div class="meta">
              <span>${escapeHtml(a.type || 'Anime')}</span>
              <span>${a.score ? '★ ' + escapeHtml(a.score) : 'No rating'}</span>
            </div>
            <div class="chips">${genres}</div>
            <p><b>Episodes:</b> ${escapeHtml(a.episodes ?? 'Unknown')}</p>
            <p><b>Status:</b> ${escapeHtml(a.status || 'Unknown')}</p>
            <p>${escapeHtml(a.synopsis || 'No synopsis available.')}</p>
            ${trailer}
          </div>
        </div>
      `;
    } catch (error) {
      details.innerHTML = '<div class="status">Could not load details.</div>';
    }
  }

  searchForm.addEventListener('submit', e => {
    e.preventDefault();
    query = searchInput.value.trim();
    page = 1;
    sectionTitle.textContent = query
      ? '🔎 Search Results'
      : '🔥 Popular Anime';
    loadAnime(true);
  });

  loadBtn.addEventListener('click', () => {
    page++;
    loadAnime(false);
  });

  closeBtn.onclick = () => modal.classList.remove('show');

  modal.addEventListener('click', e => {
    if (e.target === modal) modal.classList.remove('show');
  });

  loadAnime(true);
</script>

</body>
</html>
