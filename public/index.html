<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Fix</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0f0f0f;color:#fff;margin:0;padding:15px}
    h1{text-align:center;color:#ff6600}
    .search-box{display:flex;justify-content:center;margin-bottom:20px;gap:10px}
    input{padding:10px;font-size:16px;width:60%;border-radius:5px;border:none}
    button{padding:10px 15px;background:#ff6600;color:#fff;border:0;font-size:16px;border-radius:5px;cursor:pointer}
    #status{text-align:center;margin:12px;color:#bbb}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}
    .card{background:#1e1e1e;border-radius:8px;overflow:hidden;text-align:center;padding-bottom:8px;cursor:pointer}
    .card img{width:100%;height:190px;object-fit:cover}
    .card h3{font-size:14px;margin:8px 5px;height:36px;overflow:hidden;color:#fff}
    .card p{font-size:12px;color:#aaa;margin:5px}
    .more{text-align:center;margin:25px}
    .modal{display:none;position:fixed;z-index:10;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.9);overflow:auto}
    .modal-box{background:#1b1b1b;margin:30px auto;padding:20px;max-width:700px;border-radius:10px}
    .close{float:right;font-size:28px;color:#fff;cursor:pointer}
    .details-img{width:180px;max-width:100%;border-radius:8px}
    .meta{color:#bbb;line-height:1.7}
  .filter-box{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:15px 0}.filter-box select{padding:10px;background:#1e1e1e;color:#fff;border:1px solid #444;border-radius:5px}.filter-box button{padding:10px 15px;background:#ff6600;color:#fff;border:0;border-radius:5px;cursor:pointer}@media(max-width:600px){.filter-box{flex-direction:column}.filter-box select,.filter-box button{width:100%}}\n  </style>




<style>
.anime-filters{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:10px;
  width:100%;
  max-width:1200px;
  margin:18px auto;
  padding:12px;
  box-sizing:border-box;
}

.anime-filters select{
  min-width:145px;
  min-height:44px;
  padding:10px 12px;
  background:#1e1e1e;
  color:#fff;
  border:1px solid #555;
  border-radius:8px;
  font-size:14px;
  outline:none;
}

.anime-filters select:focus{
  border-color:#ff6600;
}

.anime-filters button{
  min-height:44px;
  padding:10px 16px;
  border:0;
  border-radius:8px;
  background:#ff6600;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.anime-filters button:active{
  transform:scale(.97);
}

#resetFiltersButton{
  background:#444;
}

@media(max-width:600px){
  .anime-filters{
    flex-direction:column;
    padding:10px;
  }

  .anime-filters select,
  .anime-filters button{
    width:100%;
    min-width:0;
  }
}
</style>

</head>
<body>

<h1>Anime Fix</h1>

<div class="search-box">
  <input id="searchInput" type="text" placeholder="Search anime...">
  <button onclick="searchAnime()">Search</button>
</div>



<div id="animeFilters" class="anime-filters">

  <select id="genreFilter">
    <option value="">🎭 All Genres</option>
    <option value="Action">Action</option>
    <option value="Adventure">Adventure</option>
    <option value="Comedy">Comedy</option>
    <option value="Drama">Drama</option>
    <option value="Fantasy">Fantasy</option>
    <option value="Romance">Romance</option>
    <option value="Sci-Fi">Sci-Fi</option>
    <option value="Sports">Sports</option>
    <option value="Horror">Horror</option>
    <option value="Mystery">Mystery</option>
    <option value="Supernatural">Supernatural</option>
    <option value="Thriller">Thriller</option>
  </select>

  <select id="typeFilter">
    <option value="">📺 All Types</option>
    <option value="tv">TV</option>
    <option value="movie">Movie</option>
    <option value="ova">OVA</option>
    <option value="ona">ONA</option>
    <option value="special">Special</option>
    <option value="music">Music</option>
  </select>

  <select id="statusFilter">
    <option value="">📡 All Status</option>
    <option value="airing">Currently Airing</option>
    <option value="finished">Finished</option>
  </select>

  <select id="yearFilter">
    <option value="">📅 All Years</option>
    <option value="2026">2026</option>
    <option value="2025">2025</option>
    <option value="2024">2024</option>
    <option value="2023">2023</option>
    <option value="2022">2022</option>
    <option value="2021">2021</option>
    <option value="2020">2020</option>
    <option value="2019">2019</option>
    <option value="2018">2018</option>
    <option value="2017">2017</option>
    <option value="2016">2016</option>
    <option value="2015">2015</option>
  </select>

  <select id="sortFilter">
    <option value="">↕️ Default</option>
    <option value="score">⭐ Highest Score</option>
    <option value="popularity">🔥 Most Popular</option>
    <option value="title">🔤 A-Z</option>
    <option value="newest">🆕 Newest</option>
  </select>

  <select id="scoreFilter">
    <option value="">⭐ Any Score</option>
    <option value="9">9+</option>
    <option value="8">8+</option>
    <option value="7">7+</option>
    <option value="6">6+</option>
  </select>

  <button type="button" id="applyFiltersButton">
    🔎 Apply Filters
  </button>

  <button type="button" id="resetFiltersButton">
    ↩️ Reset
  </button>

</div>

<div id="status">Loading anime...</div>
<div id="animeContainer" class="grid"></div>

<div class="more">
  <button onclick="loadMore()">⚡ Load More Anime</button>
</div>

<div id="animeModal" class="modal">
  <div class="modal-box">
    <span class="close" onclick="closeModal()">×</span>
    <div id="modalDetails">Loading...</div>
  </div>
</div>

<script>
let currentPage = 1;
let loading = false;
let searchMode = false;

async function fetchAnime(url, append=false) {
  if (loading) return;
  loading = true;

  const status = document.getElementById('status');
  status.innerText = '⏳ Loading anime...';

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('API error');

    const data = await res.json();
    const list = data.data || [];

    renderAnime(list, append);

    status.innerText = list.length
      ? `Showing ${list.length} anime`
      : 'No anime found.';
  } catch (e) {
    console.error(e);
    status.innerText = '❌ Error loading anime.';
  } finally {
    loading = false;
  }
}

function loadAnime(page=1) {
  searchMode = false;
  currentPage = page;
  fetchAnime(`/api/all-anime?page=${page}`, page > 1);
}

function loadMore() {
  if (!searchMode) {
    currentPage++;
    fetchAnime(`/api/all-anime?page=${currentPage}`, true);
  }
}

async function searchAnime() {
  const q = document.getElementById('searchInput').value.trim();

  if (!q) {
    currentPage = 1;
    loadAnime(1);
    return;
  }

  searchMode = true;
  loading = true;
  document.getElementById('status').innerText = '🔎 Searching...';

  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    if (!res.ok) throw new Error('Search error');

    const data = await res.json();
    renderAnime(data.data || [], false);

    document.getElementById('status').innerText =
      `${(data.data || []).length} results found`;
  } catch (e) {
    console.error(e);
    document.getElementById('status').innerText = '❌ Search failed.';
  } finally {
    loading = false;
  }
}

function renderAnime(list, append=false) {
  const container = document.getElementById('animeContainer');

  if (!append) container.innerHTML = '';

  if (!list.length && !append) {
    container.innerHTML = '<p>No anime found.</p>';
    return;
  }

  list.forEach(item => {
    const anime = item.node || item;

    const id = anime.id;
    const title = anime.title || 'Unknown Anime';
    const image =
      anime.main_picture?.large ||
      anime.main_picture?.medium ||
      '';

    const score = anime.mean ?? 'N/A';
    const episodes = anime.num_episodes || 'N/A';

    const card = document.createElement('div');
    card.className = 'card';

    card.onclick = () => showAnime(id);

    card.innerHTML = `
      <img src="${image}" alt="${escapeHtml(title)}" loading="lazy">
      <h3>${escapeHtml(title)}</h3>
      <p>⭐ ${score} &nbsp; • &nbsp; 📺 ${episodes}</p>
    `;

    container.appendChild(card);
  });
}

async function showAnime(id) {
  const modal = document.getElementById('animeModal');
  const details = document.getElementById('modalDetails');

  modal.style.display = 'block';
  details.innerHTML = '⏳ Loading details...';

  try {
    const res = await fetch(`/api/anime/${id}`);
    if (!res.ok) throw new Error('Details error');

    const anime = await res.json();

    const image =
      anime.main_picture?.large ||
      anime.main_picture?.medium ||
      '';

    const genres = (anime.genres || [])
      .map(g => g.name)
      .join(', ') || 'N/A';

    const studios = (anime.studios || [])
      .map(s => s.name)
      .join(', ') || 'N/A';

    details.innerHTML = `
      <img class="details-img" src="${image}" alt="${escapeHtml(anime.title || '')}">
      <h2>${escapeHtml(anime.title || 'Unknown Anime')}</h2>

      <div class="meta">
        ⭐ Rating: ${anime.mean ?? 'N/A'}<br>
        📺 Episodes: ${anime.num_episodes || 'N/A'}<br>
        🎭 Genres: ${escapeHtml(genres)}<br>
        🎬 Studio: ${escapeHtml(studios)}<br>
        📅 Start: ${anime.start_date || 'N/A'}<br>
        📅 End: ${anime.end_date || 'Ongoing'}
      </div>

      <p>${escapeHtml(anime.synopsis || 'No description available.')}</p>
    `;
  } catch (e) {
    console.error(e);
    details.innerHTML = '❌ Error loading details.';
  }
}

function closeModal() {
  document.getElementById('animeModal').style.display = 'none';
}

window.onclick = function(e) {
  const modal = document.getElementById('animeModal');
  if (e.target === modal) closeModal();
};

function escapeHtml(text) {
  return String(text)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

async function applyFilters() {
  const genre = document.getElementById('genreFilter').value;
  const type = document.getElementById('typeFilter').value;
  const sort = document.getElementById('sortFilter').value;

  const status = document.getElementById('status');
  status.innerText = '⏳ Applying filters...';

  try {
    const res = await fetch('/api/all-anime?page=1');
    if (!res.ok) throw new Error('Filter API error');

    const data = await res.json();

    let list = (data.data || []).filter(item => {
      const anime = item.node || item;

      const genreMatch =
        !genre ||
        (anime.genres || []).some(g => g.name === genre);

      const typeMatch =
        !type ||
        anime.media_type === type;

      return genreMatch && typeMatch;
    });

    if (sort === 'score') {
      list.sort((a, b) =>
        (b.node || b).mean - (a.node || a).mean
      );
    }

    if (sort === 'title') {
      list.sort((a, b) =>
        (a.node || a).title.localeCompare((b.node || b).title)
      );
    }

    renderAnime(list, false);

    status.innerText = `${list.length} anime found`;
  } catch (error) {
    console.error(error);
    status.innerText = '❌ Filter failed.';
  }
}

loadAnime(1);
</script>





<script>
(function(){

  let filterAnimeData = [];

  function animeObject(item){
    return item && item.node ? item.node : item;
  }

  function getGenreNames(anime){
    return (anime.genres || []).map(function(g){
      return String(g.name || '').toLowerCase();
    });
  }

  async function loadFilterData(){

    if(filterAnimeData.length > 0){
      return filterAnimeData;
    }

    const all = [];

    for(let page = 1; page <= 5; page++){

      const response = await fetch(
        '/api/all-anime?page=' + page,
        { cache: 'no-store' }
      );

      if(!response.ok){
        throw new Error('Anime API error: ' + response.status);
      }

      const json = await response.json();
      const rows = json.data || [];

      rows.forEach(function(row){
        const anime = animeObject(row);
        if(anime && anime.id){
          all.push(anime);
        }
      });

      if(rows.length < 25){
        break;
      }
    }

    filterAnimeData = all;
    return all;
  }

  function renderResults(list){

    if(typeof window.renderAnime === 'function'){
      window.renderAnime(list, false);
      return;
    }

    const container =
      document.getElementById('animeContainer');

    if(!container){
      throw new Error('animeContainer not found');
    }

    container.innerHTML = '';

    list.forEach(function(anime){

      const image =
        anime.main_picture &&
        anime.main_picture.large
          ? anime.main_picture.large
          : anime.main_picture &&
            anime.main_picture.medium
              ? anime.main_picture.medium
              : '';

      const card = document.createElement('div');

      card.className = 'anime-card';

      card.innerHTML =
        '<img src="' + image + '" alt="' +
        String(anime.title || '').replace(/"/g,'&quot;') +
        '">' +
        '<h3>' +
        String(anime.title || '') +
        '</h3>';

      container.appendChild(card);
    });
  }

  async function applyAnimeFilters(){

    const status =
      document.getElementById('status');

    const genre =
      document.getElementById('genreFilter').value.toLowerCase();

    const type =
      document.getElementById('typeFilter').value;

    const selectedStatus =
      document.getElementById('statusFilter').value;

    const year =
      document.getElementById('yearFilter').value;

    const sort =
      document.getElementById('sortFilter').value;

    const minScore =
      document.getElementById('scoreFilter').value;

    if(status){
      status.innerText = '⏳ Applying filters...';
    }

    try{

      const data = await loadFilterData();

      let results = data.filter(function(anime){

        const genres = getGenreNames(anime);

        const genreOK =
          !genre || genres.includes(genre);

        const typeOK =
          !type || anime.media_type === type;

        const score =
          Number(anime.mean || 0);

        const scoreOK =
          !minScore ||
          score >= Number(minScore);

        const yearOK =
          !year ||
          String(anime.start_date || '')
            .startsWith(year);

        let statusOK = true;

        if(selectedStatus === 'finished'){
          statusOK =
            anime.end_date !== null &&
            anime.end_date !== undefined &&
            anime.end_date !== '';
        }

        if(selectedStatus === 'airing'){
          statusOK =
            !anime.end_date ||
            anime.end_date === null;
        }

        return (
          genreOK &&
          typeOK &&
          scoreOK &&
          yearOK &&
          statusOK
        );
      });

      if(sort === 'score'){
        results.sort(function(a,b){
          return Number(b.mean || 0) -
                 Number(a.mean || 0);
        });
      }

      if(sort === 'popularity'){
        results.sort(function(a,b){
          return Number(a.popularity || 999999) -
                 Number(b.popularity || 999999);
        });
      }

      if(sort === 'title'){
        results.sort(function(a,b){
          return String(a.title || '')
            .localeCompare(String(b.title || ''));
        });
      }

      if(sort === 'newest'){
        results.sort(function(a,b){
          return String(b.start_date || '')
            .localeCompare(String(a.start_date || ''));
        });
      }

      renderResults(results);

      if(status){
        status.innerText =
          '✅ ' + results.length + ' anime found';
      }

    }catch(error){

      console.error('Anime Fix filter error:', error);

      if(status){
        status.innerText =
          '❌ Filter error: ' + error.message;
      }
    }
  }

  function resetAnimeFilters(){

    [
      'genreFilter',
      'typeFilter',
      'statusFilter',
      'yearFilter',
      'sortFilter',
      'scoreFilter'
    ].forEach(function(id){

      const element =
        document.getElementById(id);

      if(element){
        element.value = '';
      }

    });

    filterAnimeData = [];

    if(typeof window.loadAnime === 'function'){
      window.loadAnime(1);
    }else{
      location.reload();
    }
  }

  document.addEventListener('click', function(event){

    if(event.target.closest('#applyFiltersButton')){
      event.preventDefault();
      applyAnimeFilters();
    }

    if(event.target.closest('#resetFiltersButton')){
      event.preventDefault();
      resetAnimeFilters();
    }

  });

  window.applyAnimeFilters = applyAnimeFilters;
  window.resetAnimeFilters = resetAnimeFilters;

})();
</script>

</body>
</html>
