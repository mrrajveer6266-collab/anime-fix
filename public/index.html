<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Salt - Modern Anime Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f12; color: #fff; padding: 15px; }
    header { text-align: center; padding: 15px 0; }
    h1 { color: #ff6600; font-size: 28px; letter-spacing: 1px; }
    .search-box { display: flex; justify-content: center; margin: 20px 0; gap: 10px; }
    input { padding: 12px; font-size: 15px; width: 70%; max-width: 400px; border-radius: 6px; border: 1px solid #333; background: #1a1a24; color: #fff; outline: none; }
    button { padding: 12px 20px; background: #ff6600; color: white; border: none; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    
    section { margin-bottom: 30px; }
    h2 { margin-bottom: 15px; color: #ff9933; border-bottom: 2px solid #222; padding-bottom: 5px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    .card { background: #181824; border-radius: 8px; overflow: hidden; text-align: center; cursor: pointer; transition: transform 0.2s; border: 1px solid #282838; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card h3 { font-size: 13px; padding: 8px 5px; height: 40px; overflow: hidden; color: #e1e1e1; }
    .card p { font-size: 11px; color: #ffaa00; padding-bottom: 8px; }

    .btn-container { text-align: center; margin: 25px 0; }
    .load-btn { background: #222233; color: #ff6600; border: 1px solid #ff6600; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* Modal Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; overflow-y: auto; padding: 20px; }
    .modal-content { background: #1a1a26; max-width: 500px; margin: 30px auto; padding: 20px; border-radius: 10px; position: relative; border: 1px solid #ff6600; }
    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; color: #fff; cursor: pointer; }
    .modal img { width: 100%; max-height: 280px; object-fit: contain; border-radius: 8px; margin-bottom: 15px; }
    .modal h2 { border: none; color: #ff6600; }
    .modal p { font-size: 14px; line-height: 1.5; color: #ccc; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>ANIME SALT</h1>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search anime (e.g. Naruto)...">
    <button onclick="searchAnime()">Search</button>
  </div>

  <section>
    <h2>🔥 Popular Anime</h2>
    <div id="popularContainer" class="grid">Loading popular anime...</div>
  </section>

  <section>
    <h2>📚 All Anime Catalog</h2>
    <div id="allAnimeContainer" class="grid">Loading catalog...</div>
    <div class="btn-container">
      <button id="loadMoreBtn" class="load-btn" onclick="loadMoreAnime()">Load More Anime</button>
    </div>
  </section>

  <!-- Details Modal -->
  <div id="animeModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalDetails">Loading details...</div>
    </div>
  </div>

  <script>
    let currentPage = 1;

    async function fetchPopular() {
      try {
        const res = await fetch('/api/anime');
        const d = await res.json();
        const list = d.anime || d.data || [];
        renderCards(list, 'popularContainer');
      } catch(e) {
        document.getElementById('popularContainer').innerText = 'Anime load nahi ho paya.';
      }
    }

    async function fetchCatalog(page = 1) {
      try {
        const res = await fetch(`/api/all-anime?page=${page}`);
        const d = await res.json();
        const list = d.anime || d.data || [];
        renderCards(list, 'allAnimeContainer', page > 1);
      } catch(e) {
        document.getElementById('allAnimeContainer').innerText = 'Anime load nahi ho paya.';
      }
    }

    async function loadMoreAnime() {
      currentPage++;
      const btn = document.getElementById('loadMoreBtn');
      btn.innerText = 'Loading...';
      await fetchCatalog(currentPage);
      btn.innerText = 'Load More Anime';
    }

    async function searchAnime() {
      const q = document.getElementById('searchInput').value;
      if (!q) return;
      document.getElementById('popularContainer').innerHTML = '';
      document.getElementById('allAnimeContainer').innerText = 'Searching...';
      document.getElementById('loadMoreBtn').style.display = 'none';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const d = await res.json();
        const list = d.anime || d.data || [];
        renderCards(list, 'allAnimeContainer');
      } catch(e) {
        document.getElementById('allAnimeContainer').innerText = 'Search failed.';
      }
    }

    function renderCards(list, containerId, append = false) {
      const container = document.getElementById(containerId);
      if (!append) container.innerHTML = '';
      
      if (!list || list.length === 0) {
        if (!append) container.innerText = 'Koi anime nahi mila.';
        return;
      }

      list.forEach(anime => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => showAnime(anime.mal_id);
        card.innerHTML = `
          <img src="${anime.images?.jpg?.image_url || ''}" alt="${anime.title}">
          <h3>${anime.title}</h3>
          <p>⭐ ${anime.score || 'N/A'}</p>
        `;
        container.appendChild(card);
      });
    }

    async function showAnime(mal_id) {
      const modal = document.getElementById('animeModal');
      const modalDetails = document.getElementById('modalDetails');
      modal.style.display = 'block';
      modalDetails.innerHTML = '<h3>Loading details...</h3>';

      try {
        const res = await fetch(`/api/anime/${mal_id}`);
        const result = await res.json();
        const anime = result.data || result;

        let trailerHTML = '';
        if (anime.trailer?.embed_url) {
          trailerHTML = `
            <h4 style="margin-top:15px; color:#ff6600;">Official Trailer</h4>
            <iframe src="${anime.trailer.embed_url}" width="100%" height="200" frameborder="0" allowfullscreen style="margin-top:8px; border-radius:6px;"></iframe>
          `;
        }

        modalDetails.innerHTML = `
          <img src="${anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url}">
          <h2>${anime.title}</h2>
          <p><strong>Score:</strong> ⭐ ${anime.score || 'N/A'} | <strong>Episodes:</strong> ${anime.episodes || 'N/A'}</p>
          <p><strong>Status:</strong> ${anime.status || 'N/A'}</p>
          <p style="margin-top:10px;">${anime.synopsis ? anime.synopsis.slice(0, 300) + '...' : 'No synopsis available.'}</p>
          ${trailerHTML}
        `;
      } catch (e) {
        modalDetails.innerHTML = '<h3>Details load karne mein dikkat hui.</h3>';
      }
    }

    function closeModal() {
      document.getElementById('animeModal').style.display = 'none';
    }

    fetchPopular();
    fetchCatalog();
  </script>
</body>
</html>
