<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Fix - Streaming & Catalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #0b0c10; color: #fff; padding-bottom: 50px; }

    /* Navbar */
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(18, 18, 24, 0.95); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); border-bottom: 1px solid #222; }
    .logo { font-size: 24px; font-weight: 700; color: #ff6600; text-transform: uppercase; letter-spacing: 1.5px; text-shadow: 0 0 10px rgba(255,102,0,0.5); }
    
    /* Search Bar */
    .search-box { display: flex; gap: 8px; width: 100%; max-width: 350px; }
    input { width: 100%; padding: 10px 14px; font-size: 14px; border-radius: 20px; border: 1px solid #333; background: #1f1f2e; color: #fff; outline: none; transition: 0.3s; }
    input:focus { border-color: #ff6600; box-shadow: 0 0 10px rgba(255,102,0,0.3); }
    .search-btn { padding: 10px 18px; background: #ff6600; color: white; border: none; font-size: 14px; font-weight: 600; border-radius: 20px; cursor: pointer; transition: 0.3s; }
    .search-btn:hover { background: #e65c00; box-shadow: 0 0 12px rgba(255,102,0,0.6); }

    /* Hero Banner */
    .hero { margin: 20px 5%; height: 200px; background: linear-gradient(90deg, rgba(15,15,20,0.95) 0%, rgba(255,102,0,0.15) 100%), url('https://images4.alphacoders.com/666/666838.jpg') center/cover; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; padding: 25px; border: 1px solid rgba(255,102,0,0.3); }
    .hero h2 { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 5px; }
    .hero p { font-size: 13px; color: #aaa; max-width: 80%; }

    /* Main Layout */
    .container { padding: 0 5%; }
    section { margin-top: 30px; }
    .section-title { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; border-left: 4px solid #ff6600; padding-left: 10px; }

    /* Grid Display */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; }
    
    /* Crunchyroll Card Style */
    .card { background: #161622; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.3s ease; border: 1px solid #232333; position: relative; }
    .card:hover { transform: translateY(-8px) scale(1.02); border-color: #ff6600; box-shadow: 0 8px 20px rgba(255,102,0,0.3); }
    .card-img-wrapper { position: relative; width: 100%; height: 210px; overflow: hidden; }
    .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .card:hover img { transform: scale(1.08); }
    .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75); color: #ffaa00; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; backdrop-filter: blur(4px); border: 1px solid rgba(255,170,0,0.4); }
    
    .card-info { padding: 12px 10px; text-align: left; }
    .card-info h3 { font-size: 13px; font-weight: 600; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-info p { font-size: 11px; color: #888; margin-top: 4px; }

    /* Loader Indicator */
    .loading-status { text-align: center; margin: 30px 0; font-size: 15px; color: #ff6600; font-weight: 600; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 200; overflow-y: auto; padding: 20px 10px; backdrop-filter: blur(8px); }
    .modal-content { background: #151520; max-width: 550px; margin: 40px auto; padding: 25px; border-radius: 16px; position: relative; border: 1px solid rgba(255,102,0,0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .close-btn { position: absolute; top: 12px; right: 18px; font-size: 28px; color: #aaa; cursor: pointer; transition: 0.2s; }
    .close-btn:hover { color: #ff6600; }
    .modal img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; margin-bottom: 15px; }
    .modal h2 { font-size: 22px; color: #ff6600; margin-bottom: 10px; }
    .modal-meta { font-size: 13px; color: #bbb; margin-bottom: 12px; display: flex; gap: 15px; flex-wrap: wrap; }
    .modal p { font-size: 13px; line-height: 1.6; color: #ccc; margin-top: 10px; }
    .trailer-btn { display: inline-block; margin-top: 18px; padding: 10px 22px; background: #ff0000; color: white; text-decoration: none; font-weight: 600; border-radius: 8px; font-size: 13px; transition: 0.3s; }
    .trailer-btn:hover { background: #cc0000; box-shadow: 0 0 12px rgba(255,0,0,0.5); }
  </style>
</head>
<body>

  <header>
    <div class="logo">Anime Fix</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search anime...">
      <button class="search-btn" onclick="searchAnime()">Search</button>
    </div>
  </header>

  <div class="hero">
    <h2>Infinite Anime Library</h2>
    <p>Scroll down to explore thousands of anime uninterrupted.</p>
  </div>

  <div class="container">
    <section>
      <div class="section-title">🔥 Top Trending Anime</div>
      <div id="popularContainer" class="grid">Loading trending anime...</div>
    </section>

    <section>
      <div class="section-title">📚 Massive Catalog</div>
      <div id="allAnimeContainer" class="grid">Loading catalog...</div>
      <div id="loadingStatus" class="loading-status">⚡ Scroll down for more anime...</div>
    </section>
  </div>

  <!-- Details Modal -->
  <div id="animeModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalDetails">Loading details...</div>
    </div>
  </div>

  <script>
    let currentPage = 1;
    let isLoading = false;
    let isSearchMode = false;

    async function fetchPopular() {
      try {
        const res = await fetch('/api/anime');
        const d = await res.json();
        const list = d.data || d.anime || [];
        renderCards(list, 'popularContainer');
      } catch(e) {
        document.getElementById('popularContainer').innerText = 'Failed to load trending anime.';
      }
    }

    async function fetchCatalog(page = 1) {
      if (isLoading || isSearchMode) return;
      isLoading = true;
      document.getElementById('loadingStatus').innerText = '⏳ Loading more anime...';

      try {
        const res = await fetch(`/api/all-anime?page=${page}`);
        const d = await res.json();
        const list = d.data || d.anime || [];
        renderCards(list, 'allAnimeContainer', page > 1);
        document.getElementById('loadingStatus').innerText = '⚡ Scroll down for more anime...';
      } catch(e) {
        document.getElementById('loadingStatus').innerText = 'Error loading anime.';
      } finally {
        isLoading = false;
      }
    }

    async function searchAnime() {
      const q = document.getElementById('searchInput').value;
      if (!q) return;
      isSearchMode = true;
      document.getElementById('popularContainer').style.display = 'none';
      document.getElementById('allAnimeContainer').innerText = 'Searching...';
      document.getElementById('loadingStatus').style.display = 'none';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const d = await res.json();
        const list = d.data || d.anime || [];
        renderCards(list, 'allAnimeContainer');
      } catch(e) {
        document.getElementById('allAnimeContainer').innerText = 'Search failed.';
      }
    }

    function renderCards(list, containerId, append = false) {
      const container = document.getElementById(containerId);
      if (!append) container.innerHTML = '';
      
      if (!list || list.length === 0) {
        if (!append) container.innerText = 'No anime found.';
        return;
      }

      list.forEach(anime => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => showAnime(anime.mal_id);
        card.innerHTML = `
          <div class="card-img-wrapper">
            <span class="badge">⭐ ${anime.score || 'N/A'}</span>
            <img src="${anime.images?.jpg?.image_url || ''}" alt="${anime.title}">
          </div>
          <div class="card-info">
            <h3>${anime.title}</h3>
            <p>${anime.episodes ? anime.episodes + ' Episodes' : 'TV Series'}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function showAnime(mal_id) {
      const modal = document.getElementById('animeModal');
      const modalDetails = document.getElementById('modalDetails');
      modal.style.display = 'block';
      modalDetails.innerHTML = '<h3 style="color:#fff;">Loading details...</h3>';

      try {
        const res = await fetch(`/api/anime/${mal_id}`);
        const result = await res.json();
        const anime = result.data || result;

        if (!anime || !anime.title) {
          modalDetails.innerHTML = '<h3 style="color:#fff;">Details unavailable.</h3>';
          return;
        }

        let trailerHTML = '';
        if (anime.trailer?.url) {
          trailerHTML = `
            <div>
              <a href="${anime.trailer.url}" target="_blank" class="trailer-btn">▶ Watch Trailer on YouTube</a>
            </div>
          `;
        }

        modalDetails.innerHTML = `
          <img src="${anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url}">
          <h2>${anime.title}</h2>
          <div class="modal-meta">
            <span>⭐ ${anime.score || 'N/A'} Score</span>
            <span>📺 ${anime.episodes || 'N/A'} Episodes</span>
            <span>📌 ${anime.status || 'N/A'}</span>
          </div>
          <p>${anime.synopsis ? anime.synopsis.slice(0, 400) + '...' : 'No synopsis available.'}</p>
          ${trailerHTML}
        `;
      } catch (e) {
        modalDetails.innerHTML = '<h3 style="color:#fff;">Details load karne mein dikkat hui.</h3>';
      }
    }

    function closeModal() {
      document.getElementById('animeModal').style.display = 'none';
    }

    // Auto-scroll infinite loading listener
    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
        if (!isLoading && !isSearchMode) {
          currentPage++;
          fetchCatalog(currentPage);
        }
      }
    });

    fetchPopular();
    fetchCatalog();
  </script>
</body>
</html>
