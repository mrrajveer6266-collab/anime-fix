<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Fix - Stream High Quality Anime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="logo" onclick="showCatalogPage()">🎬 Anime<span>Fix</span></div>
    <div class="search-bar-top">
      <input type="text" id="searchInput" placeholder="Search anime (e.g., Naruto, One Piece)...">
      <button onclick="handleSearch()">🔍</button>
    </div>
  </header>

  <!-- PAGE 1: CATALOG PAGE -->
  <main id="catalogPage" class="container">
    <div class="hero-section">
      <h1>Find & Stream Unlimited Anime</h1>
      <p id="statusText">⏳ Fetching latest anime catalog...</p>
    </div>

    <!-- Filter Section -->
    <div class="filter-box">
      <select id="typeFilter" onchange="applyFilters()">
        <option value="">All Types</option>
        <option value="tv">TV Series</option>
        <option value="movie">Movies</option>
        <option value="ova">OVA</option>
      </select>
      <select id="ratingFilter" onchange="applyFilters()">
        <option value="">Any Rating</option>
        <option value="8">⭐ 8.0+</option>
        <option value="7">⭐ 7.0+</option>
      </select>
      <button class="reset-btn" onclick="resetFilters()">🔄 Reset</button>
    </div>

    <!-- Anime Grid Container -->
    <div id="animeGrid" class="anime-grid"></div>
  </main>

  <!-- PAGE 2: FULLSCREEN WATCH INTERFACE -->
  <main id="watchPage" class="watch-container" style="display: none;">
    <button class="back-btn" onclick="showCatalogPage()">⬅ Back to Catalog</button>

    <!-- HD Video Player Container -->
    <div class="player-wrapper">
      <iframe id="mainIframe" allowfullscreen src="" frameborder="0"></iframe>
    </div>

    <!-- Video Server & External Stream Controls -->
    <div class="server-controls">
      <span class="server-label">Servers:</span>
      <button class="srv-btn active" id="srv1" onclick="switchServer(1)">Server 1 (VidSrc)</button>
      <button class="srv-btn" id="srv2" onclick="switchServer(2)">Server 2 (Embed)</button>
      <button class="srv-btn" id="srv3" onclick="switchServer(3)">Server 3 (Gogo)</button>
      <a id="externalStreamBtn" class="direct-stream-btn" target="_blank" href="#">🚀 Open Direct Stream</a>
    </div>

    <!-- Anime Details Section -->
    <div class="anime-details-box">
      <img id="detailPoster" src="" alt="Poster" class="detail-poster">
      <div class="detail-info">
        <h2 id="detailTitle">Anime Title</h2>
        <p id="detailMeta" class="detail-meta">Loading details...</p>
        <p id="detailSynopsis" class="detail-synopsis"></p>
      </div>
    </div>

    <!-- Episode Grid Section -->
    <div class="episodes-section">
      <h3>Select Episode</h3>
      <div id="episodeGrid" class="episode-grid"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
