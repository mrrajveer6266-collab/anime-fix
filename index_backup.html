<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Fix</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    h1 { text-align: center; color: #ff6600; }
    .search-box { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
    input { padding: 10px; font-size: 16px; width: 60%; border-radius: 5px; border: none; }
    button { padding: 10px 15px; background: #ff6600; color: white; border: none; font-size: 16px; border-radius: 5px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    .card { background: #1e1e1e; border-radius: 8px; overflow: hidden; text-align: center; padding-bottom: 8px; }
    .card img { width: 100%; height: 190px; object-fit: cover; }
    .card h3 { font-size: 14px; margin: 8px 5px; height: 36px; overflow: hidden; color: #fff; }
  </style>
</head>
<body>
  <h1>Anime Fix</h1>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search anime (e.g. Naruto)...">
    <button onclick="searchAnime()">Search</button>
  </div>
  <div id="animeContainer" class="grid">Loading trending anime...</div>

  <script>
    async function loadTrending() {
      try {
        const res = await fetch('/api/trending');
        const data = await res.json();
        renderAnime(data);
      } catch (e) {
        document.getElementById('animeContainer').innerText = 'Error loading anime.';
      }
    }

    async function searchAnime() {
      const q = document.getElementById('searchInput').value;
      if (!q) return loadTrending();
      document.getElementById('animeContainer').innerText = 'Searching...';
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        renderAnime(data);
      } catch (e) {
        document.getElementById('animeContainer').innerText = 'Search failed.';
      }
    }

    function renderAnime(list) {
      const container = document.getElementById('animeContainer');
      container.innerHTML = '';
      if (!list || list.length === 0) {
        container.innerText = 'No anime found.';
        return;
      }
      list.forEach(anime => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
          <h3>${anime.title}</h3>
        `;
        container.appendChild(card);
      });
    }

    loadTrending();
  </script>
</body>
</html>
